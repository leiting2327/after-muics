name: Build iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Generate platform files
        run: flutter create . --org com.aftermusic --project-name after_music

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Pack .app into zip
        run: |
          cd build/ios/iphoneos
          ls -la
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../AfterMusic-unsigned.zip Payload/

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: after-music-ios-unsigned
          path: build/AfterMusic-unsigned.zip
